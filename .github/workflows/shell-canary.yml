name: Shell canary

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/shell-canary.yml
      - scripts/shell-canary/**
      - scripts/release/build-guest.sh
      - guest-build/**

permissions:
  contents: read

concurrency:
  group: shell-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Current packages and guest shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Export the guest builder
        run: scripts/release/build-guest.sh --source-only --output "$RUNNER_TEMP/guest-source"
      - name: Load the shell with current packages
        run: |
          mkdir -p canary-results
          # Use the guest's bootstrap image, then fully upgrade it. No package lock.
          image=$(awk '$1 == "FROM" {print $2; exit}' "$RUNNER_TEMP/guest-source/guest/Containerfile")
          set -o pipefail
          # Sway's packaged executable carries cap_sys_nice.
          docker run --rm --cap-add SYS_NICE \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/guest-source:/guest-source:ro" \
            -v "$GITHUB_WORKSPACE/canary-results:/results" \
            "$image" \
            bash /repo/scripts/shell-canary/run.sh 2>&1 | tee canary-results/setup.log
      - name: Summarize and check logs
        if: always()
        run: python3 scripts/shell-canary/check.py canary-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain logs and source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-canary-${{ github.run_id }}
          path: canary-results/
          retention-days: 14
          if-no-files-found: error
