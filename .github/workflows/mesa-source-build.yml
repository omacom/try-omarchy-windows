name: Mesa D3D12 source build
on:
  workflow_dispatch:
  push:
    branches: [windows-nvgpu-lab]
    paths:
      - experimental/windows-native-gpu/mesa/**
      - .github/workflows/mesa-source-build.yml
  pull_request:
    paths:
      - experimental/windows-native-gpu/mesa/**
      - .github/workflows/mesa-source-build.yml
permissions:
  contents: read
concurrency:
  group: mesa-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  d3d12-compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: microsoft/DirectX-Headers
          ref: adbd6f3ba40795c46a8d0f33af00bcb57ff0f0a4
          path: .runtime-headers
      - name: Install CPU compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build pkg-config bison flex python3-venv python3-mako python3-yaml python3-packaging libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev libelf-dev libffi-dev
          python3 -m venv --system-site-packages "$RUNNER_TEMP/meson-env"
          "$RUNNER_TEMP/meson-env/bin/python" -m pip install --only-binary=:all: --require-hashes -r experimental/windows-native-gpu/mesa/source-build-tools.txt
      - name: Compile and stage pinned DirectX headers; tests disabled
        run: |
          "$RUNNER_TEMP/meson-env/bin/meson" setup "$RUNNER_TEMP/headers-build" .runtime-headers --prefix "$RUNNER_TEMP/headers-install" --libdir lib -Dbuild-test=false
          "$RUNNER_TEMP/meson-env/bin/meson" install -C "$RUNNER_TEMP/headers-build"
      - name: Build pinned Wayland libraries, scanner and protocol data; tests disabled
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          records = json.loads(pathlib.Path('experimental/windows-native-gpu/mesa/wayland-build-sources.json').read_text())['sources']
          for record in records:
              name = record['filename']
              if pathlib.Path(name).name != name:
                  raise RuntimeError('Source archive name escapes build directory')
              path = root / name
              subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--retry-all-errors', '--connect-timeout', '15', '--max-time', '180', record['url'], '-o', str(path)], check=True)
              if hashlib.sha256(path.read_bytes()).hexdigest() != record['sha256']:
                  raise RuntimeError('Pinned Wayland archive hash differs')
              subprocess.run(['tar', '-xJf', str(path), '-C', str(root)], check=True)
          PY
          meson="$RUNNER_TEMP/meson-env/bin/meson"
          "$meson" setup "$RUNNER_TEMP/wayland-build" "$RUNNER_TEMP/wayland-1.26.0" --prefix "$RUNNER_TEMP/wayland-install" --libdir lib --buildtype=release -Dtests=false -Ddocumentation=false -Ddtd_validation=false
          "$meson" compile -C "$RUNNER_TEMP/wayland-build" -j 2
          "$meson" install -C "$RUNNER_TEMP/wayland-build" --no-rebuild
          export PATH="$RUNNER_TEMP/wayland-install/bin:$PATH"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/wayland-install/lib/pkgconfig"
          test "$(pkg-config --modversion wayland-client)" = '1.26.0'
          wayland-scanner --version
          "$meson" setup "$RUNNER_TEMP/protocols-build" "$RUNNER_TEMP/wayland-protocols-1.47" --prefix "$RUNNER_TEMP/protocols-install" --buildtype=release -Dtests=false
          "$meson" install -C "$RUNNER_TEMP/protocols-build" --no-rebuild
      - name: Restore pinned Mesa archive
        id: mesa-source-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /tmp/mesa-26.0.8.tar.xz
          key: linux-mesa-source-26.0.8-caf1c0061a68e88dfa74967a7e780c0e85d65b6c4e334cd69095a5dc54ad78bc
      - name: Fetch and verify source; apply reviewed graphics and failure fixes
        run: |
          if [ ! -f /tmp/mesa-26.0.8.tar.xz ]; then
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 https://archive.mesa3d.org/mesa-26.0.8.tar.xz -o /tmp/mesa-26.0.8.tar.xz
          fi
          echo 'caf1c0061a68e88dfa74967a7e780c0e85d65b6c4e334cd69095a5dc54ad78bc  /tmp/mesa-26.0.8.tar.xz' | sha256sum --check
          tar -xJf /tmp/mesa-26.0.8.tar.xz -C "$RUNNER_TEMP"
          source="$RUNNER_TEMP/mesa-26.0.8"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_fence_fd.py "$source"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_native_sync.py "$source"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_native_images.py "$source"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_native_render.py "$source"
          python3 experimental/windows-native-gpu/mesa/test_mesa_native_presentation.py --source "$source" --output "$RUNNER_TEMP/presentation-source-controls"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_native_presentation.py "$source"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_upload_failure.py "$source"
          python3 experimental/windows-native-gpu/mesa/apply_mesa_constbuf_failure.py "$source"
      - name: Configure D3D12 graphics with real headers; graphics tests disabled
        run: |
          export PATH="$RUNNER_TEMP/wayland-install/bin:$PATH"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/headers-install/lib/pkgconfig:$RUNNER_TEMP/wayland-install/lib/pkgconfig:$RUNNER_TEMP/protocols-install/share/pkgconfig"
          test "$(pkg-config --modversion wayland-protocols)" = '1.47'
          "$RUNNER_TEMP/meson-env/bin/meson" setup "$RUNNER_TEMP/mesa-build" "$RUNNER_TEMP/mesa-26.0.8" --prefix /usr --libdir lib --wrap-mode=nofallback --buildtype=release -Dplatforms=wayland -Dgles1=disabled -Dgles2=enabled -Dxmlconfig=disabled -Dvalgrind=disabled -Dgallium-drivers=d3d12 -Dvulkan-drivers=[] -Dllvm=disabled -Dglx=disabled -Degl=enabled -Dgbm=enabled -Dglvnd=disabled -Dgallium-d3d12-video=disabled -Dgallium-va=disabled -Dvideo-codecs=[] -Dbuild-tests=false
      - name: Compile full Mesa D3D12 runtime; never load or execute it
        run: |
          "$RUNNER_TEMP/meson-env/bin/meson" compile -C "$RUNNER_TEMP/mesa-build" -j 2
      - name: Stage and inspect Linux libraries without loading or executing them
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$RUNNER_TEMP/meson-env/bin/meson" install -C "$RUNNER_TEMP/mesa-build" --no-rebuild --destdir "$RUNNER_TEMP/mesa-stage"
          "$RUNNER_TEMP/meson-env/bin/python" experimental/windows-native-gpu/mesa/verify_mesa_stage.py --source "$RUNNER_TEMP/mesa-26.0.8" --build "$RUNNER_TEMP/mesa-build" --stage "$RUNNER_TEMP/mesa-stage" --output "$RUNNER_TEMP/mesa-source-build.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mesa-d3d12-wayland-compile-evidence
          path: |
            ${{ runner.temp }}/mesa-source-build.json
            ${{ runner.temp }}/presentation-source-controls/result.json
            ${{ runner.temp }}/wayland-build/meson-logs/meson-log.txt
            ${{ runner.temp }}/protocols-build/meson-logs/meson-log.txt
            ${{ runner.temp }}/mesa-build/meson-logs/meson-log.txt
            ${{ runner.temp }}/headers-build/meson-logs/meson-log.txt
          retention-days: 14
