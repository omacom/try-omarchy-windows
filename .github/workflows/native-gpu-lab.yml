name: Native GPU experiment
on:
  workflow_dispatch:
  push:
    branches: [master, windows-nvgpu-lab]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-gpu-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile the guest aperture driver; never load it on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-headers-generic
          headers=$(printf '%s\n' /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          sh experimental/windows-native-gpu/build_guest_aperture.sh "$headers" "$RUNNER_TEMP/wddm-guest-kernel"
          sh experimental/windows-native-gpu/build_guest_render.sh "$headers" "$RUNNER_TEMP/wddm-render-kernel"
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - shell: pwsh
        run: |
          scripts/fork/build.ps1
          experimental/windows-native-gpu/build.ps1
          python experimental/windows-native-gpu/test_launcher_graphics_arguments.py --go (Get-Command go).Source --composer-test experimental/windows-native-gpu/build/qemu-launcher-arguments-test.exe --output (Join-Path $env:RUNNER_TEMP 'native-launcher-arguments')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_driver_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_launcher_lifetime_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_launcher_lifetime_protocol.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_sdl_failure_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_graphics_trace_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_deferred_residency_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_coordinator_cli.py --bridge experimental/windows-native-gpu/build/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_native_stream_cli.py --probe experimental/windows-native-gpu/build/native-stream-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          experimental/windows-native-gpu/build.ps1 -HighResolutionDiagnostic
          python experimental/windows-native-gpu/test_4k_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_launcher_lifetime_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_sdl_failure_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_graphics_trace_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_deferred_residency_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_coordinator_cli.py --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profileGoHost = Join-Path $env:RUNNER_TEMP 'launcher-profile-go.test.exe'
          go -C app test -c -o $profileGoHost .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_launcher_profile.py --go-host $profileGoHost --native-probe experimental/windows-native-gpu/build-4k/launcher-profile-test.exe --binding-fixture experimental/windows-native-gpu/build-4k/launcher-binding-fixture.exe --bridge experimental/windows-native-gpu/build-4k/driver-bridge.exe --default-bridge experimental/windows-native-gpu/build/driver-bridge.exe --output (Join-Path $env:RUNNER_TEMP 'launcher-profile-controls')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experimental/windows-native-gpu/test_native_stream_cli.py --probe experimental/windows-native-gpu/build-4k/native-stream-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          experimental/windows-native-gpu/build.ps1 -StreamingDiagnostic
          python experimental/windows-native-gpu/test_4k_cli.py --bridge experimental/windows-native-gpu/build-stream/driver-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          experimental/windows-native-gpu/sdl-interop/build.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sdl-d3d12-interop')
          experimental/windows-native-gpu/sdl-relay-producer/build.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'd3d12-named-producer')
          python experimental/windows-native-gpu/sdl-relay-producer/test_cli.py --producer (Join-Path $env:RUNNER_TEMP 'd3d12-named-producer/d3d12-named-producer.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-gpu-experiment
          path: |
            experimental/windows-native-gpu/build/native-gpu.exe
            experimental/windows-native-gpu/build/driver-bridge.exe
            experimental/windows-native-gpu/build/rgba-oracle.exe
            experimental/windows-native-gpu/build/native-stream-probe.exe
            experimental/windows-native-gpu/build-4k/driver-bridge.exe
            experimental/windows-native-gpu/build-4k/native-stream-probe.exe
            experimental/windows-native-gpu/build-4k/rgba-oracle.exe
            experimental/windows-native-gpu/build-stream/driver-bridge.exe
            experimental/windows-native-gpu/build-stream/rgba-oracle.exe
            experimental/windows-native-gpu/build/nlohmann-json-LICENSE.MIT
            dist/TryOmarchy-7Wdev.exe
  milestone-replays:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile the independent pixel oracle
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/rgba_oracle.cpp -o /tmp/rgba-oracle
      - name: Replay every milestone module in this partition
        run: python3 experimental/windows-native-gpu/run_milestone_checks.py --shard-index ${{ matrix.shard }} --shard-count 4
  portable-checks:
    runs-on: ubuntu-latest
    # Archived GPU-buffer replays run separately so they cannot starve builds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read the pinned pre-fix teardown header
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0a2dea044fdbb429055077c939f88d99eee39547
          path: .teardown-baseline
          sparse-checkout: experimental/windows-native-gpu/driver_wire.h
          sparse-checkout-cone-mode: false
      - name: Compare teardown failure paths using CPU-only mock drivers
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 experimental/windows-native-gpu/test_teardown_parent_guard.py --baseline-header .teardown-baseline/experimental/windows-native-gpu/driver_wire.h --output "$RUNNER_TEMP/teardown-parent-controls"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: teardown-parent-cpu-controls
          path: |
            ${{ runner.temp }}/teardown-parent-controls/result.json
            ${{ runner.temp }}/teardown-parent-controls/*.txt
          retention-days: 14
      - name: Check named graphics port discovery without opening devices
        run: |
          sudo python3 experimental/windows-native-gpu/test_guest_graphics_port.py --device-fixtures -v
          python3 experimental/windows-native-gpu/launcher-guest-bootstrap/generate.py "$RUNNER_TEMP/launcher-guest-bootstrap"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iexperimental/windows-native-gpu "$RUNNER_TEMP/launcher-guest-bootstrap/normal_root_graphics_service.c" -o "$RUNNER_TEMP/launcher-guest-bootstrap/service"
      - name: Check guest trace preservation and bounded progress reads
        run: |
          python3 experimental/windows-native-gpu/test_guest_bridge_log.py
          python3 experimental/windows-native-gpu/test_guest_progress_snapshot.py
          python3 experimental/windows-native-gpu/test_launcher_guest_broker_session.py
          python3 experimental/windows-native-gpu/test_normal_session_bootstrap.py --output "$RUNNER_TEMP/normal-session-bootstrap-controls"
          python3 experimental/windows-native-gpu/test_hyprland_session.py --output "$RUNNER_TEMP/hyprland-session-controls"
          python3 experimental/windows-native-gpu/test_hyprland_session_entry.py
          python3 experimental/windows-native-gpu/test_browser_target_retirement.py
          python3 experimental/windows-native-gpu/test_sustained_terminal_pulse.py
          python3 experimental/windows-native-gpu/test_normal_scene_gate.py
          python3 experimental/windows-native-gpu/test_qmp_deadline_contract.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/qmp_deadline_budget_test.cpp -o /tmp/qmp-deadline-budget-test
          /tmp/qmp-deadline-budget-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/qmp_relay_transaction_test.cpp -o /tmp/qmp-relay-transaction-test
          /tmp/qmp-relay-transaction-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/stopped_group_retirement_poll_test.cpp -o /tmp/stopped-group-retirement-poll-test
          /tmp/stopped-group-retirement-poll-test
      - name: Check bounded SDL relay host command grammar
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror experimental/qemu/sdl_command_test.c -o /tmp/sdl-command-test
          /tmp/sdl-command-test
          cc -std=c11 -O2 -Wall -Wextra -Werror experimental/qemu/sdl_boot_test.c -o /tmp/sdl-boot-test
          /tmp/sdl-boot-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/framed_write_test.cpp -o /tmp/framed-write-test
          /tmp/framed-write-test
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: microsoft/DirectX-Headers
          ref: adbd6f3ba40795c46a8d0f33af00bcb57ff0f0a4
          path: .runtime-headers
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: microsoft/libdxg
          ref: 5c28ebb4ead460c23ec5e87decb7d1af7285bb59
          path: .runtime-dxg
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hyprwm/aquamarine
          ref: f31c47a1b9d300847d8fc3108ad959448103dfc1
          path: .aquamarine-native-check
      - name: Check the pinned Aquamarine prototype and startup observer source
        run: |
          python3 experimental/windows-native-gpu/apply_aquamarine_native_render_patch.py .aquamarine-native-check
          python3 experimental/windows-native-gpu/apply_aquamarine_native_render_patch.py .aquamarine-native-check
          python3 experimental/windows-native-gpu/apply_aquamarine_native_render_patch.py .aquamarine-native-check --patch logging-lifetime
          python3 experimental/windows-native-gpu/apply_aquamarine_native_render_patch.py .aquamarine-native-check --patch logging-lifetime
          python3 experimental/windows-native-gpu/apply_aquamarine_native_input_patch.py .aquamarine-native-check
          python3 experimental/windows-native-gpu/apply_aquamarine_native_input_patch.py .aquamarine-native-check
          python3 experimental/windows-native-gpu/test_aquamarine_input_patch.py .aquamarine-native-check "$RUNNER_TEMP/aquamarine-input-controls"
          python3 experimental/windows-native-gpu/test_aquamarine_session.py .aquamarine-native-check "$RUNNER_TEMP/aquamarine-session-controls"
          python3 experimental/windows-native-gpu/test_aquamarine_session_selection.py "$RUNNER_TEMP/aquamarine-session-controls/source" "$RUNNER_TEMP/aquamarine-session-selection-controls"
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-startup-probe.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -DWDDM_BRIDGE_COMPOSITOR_HOST_CAPTURE=1 -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-capture-probe.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -DWDDM_BRIDGE_COMPOSITOR_HOST_PRESENT=1 -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-present-probe.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -DWDDM_BRIDGE_COMPOSITOR_HOST_PRESENT=1 -DWDDM_BRIDGE_COMPOSITOR_HOST_SCENE=1 -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-scene-probe.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -DWDDM_BRIDGE_COMPOSITOR_HOST_PRESENT=1 -DWDDM_BRIDGE_COMPOSITOR_HOST_SCENE=1 -DHYPRLAND_QUEUE_FRAMES=300 -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-scene-300-probe.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -DWDDM_BRIDGE_COMPOSITOR_HOST_PRESENT=1 -DWDDM_BRIDGE_COMPOSITOR_HOST_SCENE=1 -DWDDM_BRIDGE_DESKTOP_RESIZE_PROBE=1 -DHYPRLAND_QUEUE_FRAMES=300 -shared -fPIC experimental/windows-native-gpu/hyprland_startup_probe.c -ldl -pthread -o /tmp/hyprland-resize-300-probe.so
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread experimental/windows-native-gpu/atomic_line_log_test.cpp -o /tmp/atomic-line-log-test
          /tmp/atomic-line-log-test
      - run: |
          c++ -std=c++17 -Wall -Wextra -Werror experimental/windows-native-gpu/wire_test.cpp -o /tmp/native-wire-test
          /tmp/native-wire-test
          c++ -std=c++17 -Wall -Wextra -Werror experimental/windows-native-gpu/driver_wire_test.cpp -o /tmp/driver-wire-test
          c++ -std=c++17 -Wall -Wextra -Werror experimental/windows-native-gpu/native_resource_preparation_test.cpp -o /tmp/native-resource-preparation-test
          /tmp/native-resource-preparation-test
          c++ -std=c++17 -Wall -Wextra -Werror experimental/windows-native-gpu/native_buffer_preparation_test.cpp -o /tmp/native-buffer-preparation-test
          /tmp/native-buffer-preparation-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/native_metadata_attempt_test.cpp -o /tmp/native-metadata-attempt-test
          /tmp/native-metadata-attempt-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror experimental/windows-native-gpu/qemu_graphics_arguments_test.cpp -o /tmp/qemu-graphics-arguments-test
          /tmp/qemu-graphics-arguments-test
